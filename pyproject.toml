[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-httpserver>=1.1.3",
    "ruff>=0.14.14"
]

[project]
name = "sghooker"
version = "0.2.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "granian>=2.6.1",
    "pulya>=0.1.0",
    "python-card-framework>=2.4.0",
    "typer>=0.12.0",
    "uvloop>=0.22.1"
]

[project.scripts]
sghooker = "sghooker.cli:app"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ['sghooker', 'tests']

[[tool.mypy.overrides]]
module = [
    'card_framework.*',
    'typer.*'
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # Conflicts with D211 (no-blank-line-before-class)
    "D213", # Conflicts with D212 (multi-line-summary-first-line)
    "COM812" # Conflicts with the formatter (trailing comma on bare tuple)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
