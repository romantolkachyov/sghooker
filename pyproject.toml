[project]
name = "sghooker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "granian>=2.6.1",
    "msgspec>=0.20.0",
    "urlpattern>=0.1.7",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.14",
]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ['sghooker', 'tests']

[tool.locust]
host = "http://localhost:8000"
users = 1000
spawn-rate = 20
run-time = "1m"