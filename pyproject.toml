[project]
name = "sghooker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.11.0",
    "dependency-injector>=4.48.3",
    "granian>=2.6.1",
    "httpx>=0.28.1",
    "msgspec>=0.20.0",
    "python-card-framework>=2.4.0",
    "python-matchit>=0.3.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ['sghooker', 'pulya', 'tests']

[[tool.mypy.overrides]]
module = [
    'card_framework.*',
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
